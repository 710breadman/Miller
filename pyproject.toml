[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "miller-video"
version = "0.1.0"
description = "Deterministic local-first pipeline for comic-first video production."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]
web = [
    "fastapi>=0.139.0",
    "uvicorn>=0.50.0",
]
export = [
    "opentimelineio>=0.18.1",
]
retrieval = [
    "qdrant-client>=1.18.0",
    "numpy>=1.26,<2.4",
]

[project.scripts]
miller = "miller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/miller"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.miller",
  "/.miller-backups",
  "/.source-audit",
  "/.venv",
  "/.gemma",
  "/.head-chef",
  "/_quarantine",
  "/_userscripts",
  "/cache",
  "/data",
  "/projects",
  "/renders",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["miller"]

[tool.coverage.run]
branch = true
source = ["miller"]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
]
